<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layr</title>
<meta name="description" content="Place digital markers, messages and routes in real places. Walk there and open them in AR.">
<meta name="theme-color" content="#07090B">
<script>
  // pick the theme before first paint: saved choice, else the system setting
  (function () { var t; try { t = localStorage.getItem("layr.theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t; })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: full-bleed dark map with a thin HUD. Status top-left, tool rail top-right,
   one panel that collapses to a bar on phones and docks left on wide screens. */
:root {
  --bg: #EEF0F2;
  --panel: rgba(255, 255, 255, .92);
  --panel-solid: #FFFFFF;
  --raise: #F1F3F5;
  --line: #D6DADF;
  --line-2: #AEB5BD;
  --text: #11151A;
  --muted: #59626C;
  --dim: #87909A;
  --amber: #B87000;
  --amber-bg: #F2A20C;
  --amber-ink: #160E00;
  --cyan: #0A7FB0;
  --ok: #0F7A45;
  --danger: #C2342A;
  --scene-bg: #E9ECEF;
  --scene-grid: #B9C0C8;
  --scene-grid-2: #D9DDE2;
  --font-ui: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #07090B;
  --panel: rgba(10, 12, 15, .9);
  --panel-solid: #0C0F12;
  --raise: #141820;
  --line: #262B32;
  --line-2: #3A414A;
  --text: #E6E8EB;
  --muted: #8A919A;
  --dim: #5A616A;
  --amber: #FFB020;
  --amber-bg: #FFB020;
  --amber-ink: #120C00;
  --cyan: #4CC9F0;
  --ok: #5BE38C;
  --danger: #FF5A4E;
  --scene-bg: #07090B;
  --scene-grid: #3A414A;
  --scene-grid-2: #1A1F25;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); font: 14px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased; overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 1px solid var(--amber); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font: 500 10.5px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* Corner ticks for framed surfaces */
.frame { position: relative; border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.frame::before {
  content: ""; position: absolute; inset: -1px; pointer-events: none;
  --t: var(--line-2);
  background:
    linear-gradient(var(--t), var(--t)) top left / 9px 1px no-repeat,
    linear-gradient(var(--t), var(--t)) top left / 1px 9px no-repeat,
    linear-gradient(var(--t), var(--t)) top right / 9px 1px no-repeat,
    linear-gradient(var(--t), var(--t)) top right / 1px 9px no-repeat,
    linear-gradient(var(--t), var(--t)) bottom left / 9px 1px no-repeat,
    linear-gradient(var(--t), var(--t)) bottom left / 1px 9px no-repeat,
    linear-gradient(var(--t), var(--t)) bottom right / 9px 1px no-repeat,
    linear-gradient(var(--t), var(--t)) bottom right / 1px 9px no-repeat;
}

/* Map */
#map { position: absolute; inset: 0; background: var(--bg); }
.leaflet-container { background: var(--bg); font: 11px var(--font-mono); }
.tiles-map .leaflet-tile-pane { filter: grayscale(1) brightness(1.03) contrast(.9); }
.tiles-sat .leaflet-tile-pane { filter: saturate(.75) contrast(1.02); }
:root[data-theme="dark"] .tiles-map .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(.72) contrast(1.18); }
:root[data-theme="dark"] .tiles-sat .leaflet-tile-pane { filter: brightness(.62) saturate(.5) contrast(1.12); }
.leaflet-control-attribution { background: var(--panel) !important; color: var(--dim) !important; font: 9.5px var(--font-mono) !important; }
.leaflet-control-attribution a { color: var(--muted) !important; }
.leaflet-bottom.leaflet-right { bottom: var(--panel-h, 52px); }

/* Top HUD */
.hud-top {
  position: fixed; z-index: 500; top: 0; left: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 0 0 max(10px, env(safe-area-inset-left, 0px));
  display: flex; gap: 8px; align-items: stretch; max-width: calc(100vw - 70px);
}
.brand { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 40px; font: 600 14px/1 var(--font-mono); letter-spacing: .32em; }
.brand svg { width: 16px; height: 16px; flex: none; }
.readout { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 12px; height: 40px; text-align: left; min-width: 0; }
.readout .top { display: flex; align-items: center; gap: 7px; font: 600 10.5px/1 var(--font-mono); letter-spacing: .12em; }
.readout .dot { width: 6px; height: 6px; background: var(--cyan); flex: none; }
.readout.sim .dot { background: var(--amber); }
.readout .pos { font: 400 10.5px/1 var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Tool rail */
.rail {
  position: fixed; z-index: 500; right: max(10px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 10px);
  display: flex; flex-direction: column;
}
.rail button { width: 44px; height: 44px; display: grid; place-items: center; color: var(--text); border-bottom: 1px solid var(--line); }
.rail button:last-child { border-bottom: 0; }
.rail button svg { width: 18px; height: 18px; }
.rail .txt { font: 600 10px/1 var(--font-mono); letter-spacing: .1em; }
/* when hidden, a handle waits at the bottom edge: swipe it up (or tap) to bring everything back */
.show-ui {
  position: fixed; z-index: 500; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 168px; padding: 9px 0 calc(env(safe-area-inset-bottom, 0px) + 10px); border-bottom: 0;
  display: flex; flex-direction: column; align-items: center; gap: 7px; touch-action: none;
  animation: peek .3s cubic-bezier(.2, .8, .2, 1);
}
.show-ui .grip { width: 38px; height: 4px; border-radius: 2px; background: var(--line-2); }
.show-ui .label { font-size: 9.5px; }
@keyframes peek { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }
.panel-bar { touch-action: none; }
@media (prefers-reduced-motion: reduce) { .show-ui { animation: none; } }

/* Drop button */
.drop-btn {
  position: fixed; z-index: 470; right: max(10px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--panel-h, 56px) + 24px);
  height: 46px; padding: 0 18px; display: flex; align-items: center; gap: 10px;
  background: var(--amber-bg); color: var(--amber-ink); font: 600 12px/1 var(--font-mono); letter-spacing: .16em;
}
.drop-btn svg { width: 14px; height: 14px; }
@media (max-width: 819px) { .drop-btn { right: auto; left: max(10px, env(safe-area-inset-left, 0px)); } }

/* Crosshair */
.cross { position: fixed; z-index: 420; left: var(--cx, 50%); top: var(--cy, 40%); width: 64px; height: 64px; margin: -32px 0 0 -32px; pointer-events: none; }
.cross svg { width: 64px; height: 64px; }

/* Panel */
.panel {
  position: fixed; z-index: 480; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; max-height: 62vh;
  border-left: 0; border-right: 0; border-bottom: 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.panel-bar {
  display: flex; align-items: center; gap: 12px; height: 52px; flex: none; width: 100%; text-align: left;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
}
.panel-bar .sum { flex: 1; min-width: 0; display: flex; gap: 14px; align-items: baseline; }
.panel-bar .sum b { font: 600 13px/1 var(--font-mono); letter-spacing: .06em; white-space: nowrap; }
.panel-bar .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .2s; flex: none; }
.panel.open .panel-bar .chev { transform: rotate(180deg); }
.panel-body {
  overflow-y: auto; overscroll-behavior: contain; border-top: 1px solid var(--line);
  padding-block: 14px 18px;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
}
.panel:not(.open) .panel-body { display: none; }
@media (min-width: 820px) {
  .panel { left: max(10px, env(safe-area-inset-left, 0px)); right: auto; width: 360px; top: calc(env(safe-area-inset-top, 0px) + 60px); bottom: 10px; max-height: none; border: 1px solid var(--line); }
  .panel:not(.open) { bottom: auto; }
  .drop-btn { bottom: 34px !important; }
}
/* the interface slides away while you work on the map, and comes back when you let go */
.hud-top, .rail, .panel, .drop-btn { transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .2s; }
body.ui-off .hud-top, body.ui-away .hud-top { transform: translateY(calc(-100% - 24px)); opacity: 0; pointer-events: none; }
body.ui-off .rail, body.ui-away .rail { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
body.ui-off .panel, body.ui-away .panel { transform: translateY(calc(100% + 12px)); pointer-events: none; }
body.ui-off .drop-btn, body.ui-away .drop-btn { transform: translateY(160%); opacity: 0; pointer-events: none; }
@media (min-width: 820px) { body.ui-off .panel, body.ui-away .panel { transform: translateX(calc(-100% - 24px)); } }
@media (prefers-reduced-motion: reduce) { .hud-top, .rail, .panel, .drop-btn { transition: none; } }

h2 { font: 600 19px/1.2 var(--font-ui); letter-spacing: -.005em; margin: 6px 0 0; text-wrap: balance; }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }

.list { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 11px 0; border-top: 1px solid var(--line); text-align: left; }
.list li:first-child .item { border-top: 0; }
.item .ico { width: 22px; height: 22px; color: var(--muted); }
.item .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { font: 400 10.5px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { font: 600 10.5px/1 var(--font-mono); letter-spacing: .1em; padding: 5px 7px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
.tag.in { border-color: var(--ok); color: var(--ok); }
.empty { color: var(--muted); padding: 8px 0; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); margin: 14px 0; }
.stats div { background: var(--panel-solid); padding: 9px 10px; min-width: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stats dt { font: 500 9.5px/1 var(--font-mono); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.stats dd { margin: 6px 0 0; font: 500 13px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stats dd.in { color: var(--ok); }
.msg { margin: 12px 0; padding: 12px 14px; border-left: 2px solid var(--c, var(--amber)); background: var(--raise); }

.prof { display: block; width: 100%; height: 64px; }
.prof-wrap { border: 1px solid var(--line); padding: 8px 10px 6px; margin: 0 0 12px; }
.prof .wpl { stroke: var(--line-2); }
.prof .area { fill: var(--amber); fill-opacity: .1; }
.prof .ln { stroke: var(--amber); }
.prof-meta { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; }

.btn { height: 44px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2); font: 600 11.5px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--amber-bg); color: var(--amber-ink); border-color: var(--amber-bg); }
.btn.primary:disabled { background: transparent; color: var(--dim); border-color: var(--line); cursor: not-allowed; }
.btn.danger { color: var(--danger); }
.btn.armed { background: var(--danger); color: #000; border-color: var(--danger); }
.btn.icon { width: 44px; padding: 0; flex: none; }
.btn-row { display: flex; gap: 6px; }
.btn-row .grow { flex: 1; min-width: 0; }
.back { display: inline-flex; align-items: center; gap: 6px; font: 500 10.5px/1 var(--font-mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; padding: 4px 0; }

/* Compose */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); margin: 12px 0; }
.seg button { height: 36px; font: 600 10.5px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { color: var(--amber-ink); background: var(--amber-bg); }
.objs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.obj { background: var(--panel-solid); padding: 10px 6px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; min-width: 0; }
.obj svg { width: 26px; height: 26px; }
.obj span { font: 500 9.5px/1.15 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; text-align: center; min-height: 30px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
.obj[aria-pressed="true"] { color: var(--amber); }
.obj[aria-pressed="true"]::after { content: ""; position: absolute; inset: -1px; border: 1px solid var(--amber); pointer-events: none; z-index: 1; }
.objs.models { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.obj img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--raise); }
.obj.m { padding: 0; gap: 0; }
.pick-head { display: flex; justify-content: space-between; margin: 14px 0 6px; }
.thumb { width: 100%; max-width: 100%; height: 150px; object-fit: contain; background: var(--raise) !important; display: block; border: 1px solid var(--line); background: var(--raise); margin: 10px 0 0; }
.field { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
.field input[type="text"], .field textarea { width: 100%; background: var(--panel-solid); border: 1px solid var(--line); padding: 10px 11px; font-size: 16px; border-radius: 0; }
.field textarea { min-height: 76px; resize: vertical; }
.field input:focus, .field textarea:focus { border-color: var(--amber); outline: 0; }
.range { display: flex; align-items: center; gap: 12px; }
.range input { flex: 1; accent-color: var(--amber); }
.swatches { display: flex; gap: 8px; }
.swatch { width: 26px; height: 26px; border: 1px solid var(--line-2); }
.swatch[aria-pressed="true"] { outline: 1px solid var(--text); outline-offset: 2px; }

/* Markers */
.pin { width: 28px; height: 28px; display: grid; place-items: center; color: var(--amber); filter: drop-shadow(0 0 3px rgba(0,0,0,.9)); }
.pin svg { width: 28px; height: 28px; overflow: visible; }
.pin.in { color: var(--ok); }
.pin.sel { color: var(--text); }
.pin svg .fill { fill: var(--panel-solid); fill-opacity: .85; }
.pin.sel svg .fill { fill: var(--amber-bg); fill-opacity: 1; }
.me { width: 18px; height: 18px; border: 1.5px solid var(--cyan); border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 4px color-mix(in srgb, var(--cyan) 16%, transparent); background: var(--panel-solid); }
.me::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); }
.me.sim { border-color: var(--amber); box-shadow: 0 0 0 4px rgba(255, 176, 32, .14); }
.me.sim::after { background: var(--amber); }
.wp { width: 22px; height: 22px; display: grid; place-items: center; background: var(--panel-solid); border: 1px solid var(--amber); color: var(--amber); font: 600 10px/1 var(--font-mono); }
.chevron { width: 14px; height: 14px; display: block; }
.start-here { position: relative; width: 120px; height: 60px; display: grid; place-items: center; pointer-events: none; }
.start-here i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border: 1.5px solid var(--amber); border-radius: 50%; animation: ping 1.6s ease-out infinite; }
.start-here span { position: absolute; top: 100%; margin-top: -8px; font: 600 10px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--amber); background: var(--panel); padding: 4px 6px; border: 1px solid var(--line); white-space: nowrap; }
@keyframes ping { from { transform: scale(.55); opacity: .95; } to { transform: scale(1.15); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .start-here i { animation: none; } }
.leaflet-marker-draggable { cursor: grab; }

/* Toast */
.toast {
  position: fixed; z-index: 2000; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 60px);
  max-width: min(92vw, 460px); display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 14px;
  font: 500 12px/1.35 var(--font-mono); letter-spacing: .02em;
}
.toast button { color: var(--amber); font: 600 11px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; padding: 6px 4px; flex: none; }

/* AR */
#ar { position: fixed; inset: 0; z-index: 1500; background: var(--bg); }
#ar.xr { background: transparent; }
#arVideo, #arStage, #arStage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#arVideo { object-fit: cover; }
.ar-hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
.ar-top { display: flex; align-items: flex-start; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); }
.ar-top > *, .ar-bottom > * { pointer-events: auto; }
.ar-title { min-width: 0; padding: 8px 12px; }
.ar-title b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
.ar-close { margin-left: auto; width: 44px; height: 44px; display: grid; place-items: center; flex: none; }
.ar-close svg { width: 18px; height: 18px; }
.ar-bottom { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 18px); }
.ar-hint { max-width: 440px; text-align: center; padding: 9px 14px; font: 500 12px/1.4 var(--font-mono); }
.ar-ctl { display: flex; align-items: stretch; max-width: 100%; }
.ar-ctl button { width: 46px; height: 44px; display: grid; place-items: center; font: 600 16px/1 var(--font-mono); border-left: 1px solid var(--line); }
.ar-ctl button:first-child { border-left: 0; }
.ar-ctl .val .label { white-space: nowrap; }
.ar-ctl .val { padding: 0 12px; display: flex; flex-direction: column; justify-content: center; gap: 3px; border-left: 1px solid var(--line); min-width: 108px; }
.ar-ctl .val b { font: 600 13px/1 var(--font-mono); white-space: nowrap; }
.ar-ctl button[aria-pressed="false"] { color: var(--dim); }
.ar-ctl .wide { width: auto; padding: 0 12px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; }

@media (prefers-reduced-motion: reduce) { .panel-bar .chev { transition: none; } }
</style>
</head>
<body class="tiles-map">

<div id="map" aria-label="Map of drops"></div>

<header class="hud-top">
  <div class="brand frame" aria-label="Layr">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M8 1.5 14.5 5 8 8.5 1.5 5 8 1.5Z" style="stroke:var(--amber)"/><path d="m1.5 8 6.5 3.5L14.5 8"/><path d="m1.5 11 6.5 3.5 6.5-3.5" opacity=".5"/></svg>
    LAYR
  </div>
  <button class="readout frame" id="locChip" type="button" aria-label="Location source. Tap to switch between GPS and simulated.">
    <span class="top"><i class="dot"></i><span id="locSrc">LOCATING</span></span>
    <span class="pos" id="locPos">--</span>
  </button>
</header>

<nav class="rail frame" aria-label="Map tools">
  <button id="btnLocate" type="button" aria-label="Center on my location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/exporters/USDZExporter.js"></script>
<script>
"use strict";
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EARTH = 6371000, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dist(a, b) {
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * EARTH * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const y = Math.sin(rad(b.lng - a.lng)) * Math.cos(rad(b.lat));
  const x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) - Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lng - a.lng));
  return (deg(Math.atan2(y, x)) + 360) % 360;
}
function offset(p, m, brg) {
  const d = m / EARTH, b = rad(brg), la = rad(p.lat), lo = rad(p.lng);
  const la2 = Math.asin(Math.sin(la) * Math.cos(d) + Math.cos(la) * Math.sin(d) * Math.cos(b));
  const lo2 = lo + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(la), Math.cos(d) - Math.sin(la) * Math.sin(la2));
  return { lat: deg(la2), lng: deg(lo2) };
}
const fmtDist = m => m < 1000 ? Math.round(m) + " M" : (m / 1000).toFixed(m < 10000 ? 2 : 1) + " KM";
const fmtBrg = b => String(Math.round(b) % 360).padStart(3, "0") + "°";
const fmtCoord = p => Math.abs(p.lat).toFixed(5) + (p.lat >= 0 ? "N " : "S ") + Math.abs(p.lng).toFixed(5) + (p.lng >= 0 ? "E" : "W");
const routeLength = pts => { let t = 0; for (let i = 1; i < pts.length; i++) t += dist(pts[i - 1], pts[i]); return t; };
const screenAngle = () => (screen.orientation && screen.orientation.angle) || window.orientation || 0;

/* ================= catalog ================= */
/* Detailed 3D models, bundled in models/. See models/CREDITS.md. h = height in metres, size = largest side. */
const MODELS3D = {
  fox:        { name: "Fox",             file: "fox.glb",        h: .55, anim: "Survey" },
  plant:      { name: "Potted plant",    file: "plant.glb",      h: 1.0 },
  bust:       { name: "Marble bust",     file: "bust.glb",       h: .7 },
  horse:      { name: "Horse statue",    file: "horse.glb",      h: 1.1 },
  cat:        { name: "Cat statue",      file: "cat.glb",        h: .5 },
  elephant:   { name: "Wood elephant",   file: "elephant.glb",   h: .6 },
  duck:       { name: "Rubber duck",     file: "duck.glb",       h: .6 },
  chest:      { name: "Treasure chest",  file: "chest.glb",      h: .55 },
  lantern:    { name: "Lantern",         file: "lantern.glb",    h: .5 },
  streetlamp: { name: "Street lamp",     file: "streetlamp.glb", h: 3.0 },
  firepit:    { name: "Fire pit",        file: "firepit.glb",    size: 1.2 },
  boombox:    { name: "Boombox",         file: "boombox.glb",    h: .45 }
};
const OBJECTS = {
  marker:    { name: "Pin",  color: 0xFFB020, icon: '<path d="M13 3v16"/><path d="M13 5l4 4-4 4-4-4 4-4Z"/><ellipse cx="13" cy="21" rx="7" ry="2.2"/>' },
  objective: { name: "Spot", color: 0xFFB020, icon: '<path d="M13 5l7 4v8l-7 4-7-4V9l7-4Z"/><path d="M13 9l3.5 2v4L13 17l-3.5-2v-4L13 9Z"/>' },
  rally:     { name: "Ripple",     color: 0x4CC9F0, icon: '<ellipse cx="13" cy="19" rx="9" ry="3"/><ellipse cx="13" cy="19" rx="5" ry="1.6"/><path d="M13 19V5l6 3-6 3"/>' },
  hazard:    { name: "Caution",    color: 0xFF5A4E, icon: '<path d="M13 4 22 20H4L13 4Z"/><path d="M13 10v5M13 17.5v.5"/>' },
  sensor:    { name: "Beacon",    color: 0x4CC9F0, icon: '<circle cx="13" cy="8" r="4"/><path d="M9.5 10 5 21M16.5 10 21 21M5 21h16"/>' },
  cache:     { name: "Gift",     color: 0xFFB020, icon: '<path d="M5 9h16v11H5z"/><path d="M8 6h10M5 13h16"/>' }
};
const itemName = d => (MODELS3D[d.model] || OBJECTS[d.model] || OBJECTS.marker).name;
const COLORS = ["#FFB020", "#4CC9F0", "#5BE38C", "#FF5A4E", "#E6E8EB"];
const KIND = { model: "Object", message: "Message", route: "Route" };
const KIND_ICON = {
  model: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M11 2.5 19.5 11 11 19.5 2.5 11 11 2.5Z"/><circle cx="11" cy="11" r="1.6" fill="currentColor" stroke="none"/></svg>',
  message: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 4h16v11h-9l-4 3v-3H3V4Z"/><path d="M7 8h8M7 11h5"/></svg>',
  route: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="5" cy="17" r="2"/><circle cx="17" cy="5" r="2"/><path d="M7 17h6a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6"/></svg>'
};
const PIN_SVG = {
  model: '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6"><path class="fill" d="M14 3 25 14 14 25 3 14 14 3Z"/><circle cx="14" cy="14" r="2.2" fill="currentColor" stroke="none"/></svg>',
  message: '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6"><path class="fill" d="M4 5h20v14H13l-5 4v-4H4V5Z"/><path d="M8.5 10h11M8.5 14h7"/></svg>',
  route: '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6"><circle class="fill" cx="14" cy="14" r="10"/><circle cx="14" cy="14" r="3.2" fill="currentColor" stroke="none"/></svg>'
};
const DEFAULT_LOC = { lat: 38.88947, lng: -77.03524 };

/* ================= state ================= */
const S = {
  drops: store.get("layr.drops.v2", []).filter(d => !d.sample),
  me: null, lastGps: null, sim: false, firstFix: true,
  view: "list", panelOpen: false, selected: null, draft: null, dragging: false,
  xr: false, layer: "map"
};
const save = () => store.set("layr.drops.v2", S.drops);
const byId = id => S.drops.find(d => d.id === id);

/* ================= terrain (AWS terrarium tiles, keyless) ================= */
const Terrain = {
  z: 15, tiles: new Map(),
  tile(x, y) {
    const key = x + "/" + y;
    if (!this.tiles.has(key)) {
      this.tiles.set(key, new Promise(res => {
        const img = new Image(); img.crossOrigin = "anonymous";
        img.onload = () => {
          try { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"); g.drawImage(img, 0, 0); res(g.getImageData(0, 0, 256, 256).data); }
          catch (e) { res(null); }
        };
        img.onerror = () => res(null);
        img.src = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${this.z}/${x}/${y}.png`;
      }));
    }
    return this.tiles.get(key);
  },
  async elev(p) {
    const n = 2 ** this.z, la = rad(clamp(p.lat, -85, 85));
    const xf = (p.lng + 180) / 360 * n, yf = (1 - Math.log(Math.tan(la) + 1 / Math.cos(la)) / Math.PI) / 2 * n;
    const tx = Math.floor(xf), ty = Math.floor(yf);
    const data = await this.tile(tx, ty); if (!data) return null;
    const px = clamp((xf - tx) * 256 - .5, 0, 254.999), py = clamp((yf - ty) * 256 - .5, 0, 254.999);
    const x0 = Math.floor(px), y0 = Math.floor(py), fx = px - x0, fy = py - y0;
    const v = (x, y) => { const i = (y * 256 + x) * 4; return data[i] * 256 + data[i + 1] + data[i + 2] / 256 - 32768; };
    return (v(x0, y0) * (1 - fx) + v(x0 + 1, y0) * fx) * (1 - fy) + (v(x0, y0 + 1) * (1 - fx) + v(x0 + 1, y0 + 1) * fx) * fy;
  },
  many(pts) { return Promise.all(pts.map(p => this.elev(p))); }
};
function densify(points, step) {
  const total = routeLength(points); step = Math.max(step, total / 300);
  const out = [{ lat: points[0].lat, lng: points[0].lng, s: 0, wp: "wp" in points[0] ? points[0].wp : 0 }]; let s = 0;
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1], b = points[i], len = dist(a, b), n = Math.max(1, Math.ceil(len / step));
    for (let k = 1; k <= n; k++) {
      const f = k / n;
      out.push({ lat: a.lat + (b.lat - a.lat) * f, lng: a.lng + (b.lng - a.lng) * f, s: s + len * f, wp: k === n ? ("wp" in b ? b.wp : i) : null });
    }
    s += len;
  }
  return out;
}
const profileJobs = new Map();
/* The line a route actually follows: walkway geometry between stops when we have it, else straight legs. */
const routeBase = d => (d.drawn || d.walk !== false) && d.path && d.path.length > 1 ? d.path : d.points.map((p, i) => ({ lat: p.lat, lng: p.lng, wp: i }));
/* Free OpenStreetMap foot routing (FOSSGIS). Each leg follows paths and sidewalks around buildings. */
const walkJobs = new Map();
async function fetchWalk(d) {
  const job = (walkJobs.get(d.id) || 0) + 1; walkJobs.set(d.id, job);
  const legs = await Promise.all(d.points.slice(1).map((b, i) => {
    const a = d.points[i];
    return fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${a.lng.toFixed(6)},${a.lat.toFixed(6)};${b.lng.toFixed(6)},${b.lat.toFixed(6)}?overview=full&geometries=geojson`)
      .then(r => r.json()).then(j => j.code === "Ok" ? j.routes[0].geometry.coordinates.map(([lng, lat]) => ({ lat, lng })) : null).catch(() => null);
  }));
  if (walkJobs.get(d.id) !== job || !byId(d.id)) return;
  const path = []; let found = 0;
  d.points.forEach((p, i) => {
    path.push({ lat: p.lat, lng: p.lng, wp: i });
    const g = legs[i], q = d.points[i + 1]; if (!g || !q || g.length < 2) return;
    if (routeLength(g) > dist(p, q) * 3 + 60) return; // a huge detour means the router went wrong; keep the straight leg
    found++; g.forEach(c => { if (dist(c, p) > 1.5 && dist(c, q) > 1.5) path.push({ lat: c.lat, lng: c.lng, wp: null }); });
  });
  d.path = found ? path : null; d.profile = null; save(); computeProfile(d); renderPins(); refreshPanel();
}
function computeProfile(d) {
  const job = (profileJobs.get(d.id) || 0) + 1; profileJobs.set(d.id, job);
  const pts = densify(routeBase(d), 6);
  return Terrain.many(pts).then(es => {
    if (profileJobs.get(d.id) !== job || !byId(d.id)) return;
    const ok = es.every(e => e != null);
    let gain = 0, loss = 0;
    if (ok) for (let i = 1; i < es.length; i++) { const dz = es[i] - es[i - 1]; if (dz > 0) gain += dz; else loss -= dz; }
    d.profile = { ok, gain, loss, pts: pts.map((p, i) => ({ lat: p.lat, lng: p.lng, s: p.s, wp: p.wp, e: es[i] == null ? null : Math.round(es[i] * 10) / 10 })) };
    save(); if (S.view === "detail" && S.selected === d.id) renderDetail();
  });
}

/* ================= map ================= */
const map = L.map("map", { zoomControl: false, attributionControl: true }).setView([DEFAULT_LOC.lat, DEFAULT_LOC.lng], 18);
map.attributionControl.setPosition("bottomright").setPrefix(false);
const tileMap = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 21, maxNativeZoom: 19, attribution: "© OpenStreetMap" });
const tileSat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 21, maxNativeZoom: 19, attribution: "Imagery © Esri, Maxar" });
tileMap.addTo(map);
$("#btnLayer").addEventListener("click", () => {
  S.layer = S.layer === "map" ? "sat" : "map";
  if (S.layer === "sat") { map.removeLayer(tileMap); tileSat.addTo(map); } else { map.removeLayer(tileSat); tileMap.addTo(map); }
  document.body.classList.toggle("tiles-map", S.layer === "map"); document.body.classList.toggle("tiles-sat", S.layer === "sat");
  $("#layerLbl").textContent = S.layer === "map" ? "MAP" : "SAT";
});

const dropLayer = L.layerGroup().addTo(map);
const draftLayer = L.layerGroup().addTo(map);
let meMarker = null, meAcc = null;
const C = {};
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function readTheme() { C.amber = cssVar("--amber"); C.cyan = cssVar("--cyan"); C.ok = cssVar("--ok"); document.querySelector('meta[name="theme-color"]').content = cssVar("--bg"); }
readTheme();
$("#btnTheme").addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t; try { localStorage.setItem("layr.theme", t); } catch (e) {}
  readTheme(); renderPins(); if (meAcc) meAcc.setStyle({ color: C.cyan }); drawDraft();
});

function chevronsFor(points, layer, color) {
  // one direction arrow about every 35 m along the line
  let acc = 17;
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1], b = points[i], len = dist(a, b); acc += len; if (acc < 35 || len < 2) continue; acc = 0;
    const mid = { lat: (a.lat + b.lat) / 2, lng: (a.lng + b.lng) / 2 };
    L.marker([mid.lat, mid.lng], { interactive: false, keyboard: false, icon: L.divIcon({ className: "", iconSize: [14, 14], iconAnchor: [7, 7],
      html: `<svg class="chevron" style="transform:rotate(${bearing(a, b).toFixed(1)}deg);color:${color}" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9l4-4 4 4"/></svg>` }) }).addTo(layer);
  }
}

function renderPins() {
  if (S.dragging) return;
  dropLayer.clearLayers();
  for (const d of S.drops) {
    const inR = inRange(d), sel = S.selected === d.id;
    const ring = L.circle([d.lat, d.lng], { radius: d.radius, color: inR ? C.ok : C.amber, weight: 1, opacity: sel ? .9 : .45, fillOpacity: sel ? .08 : .03, dashArray: "2 6", interactive: false }).addTo(dropLayer);
    let line = null;
    if (d.kind === "route") {
      line = L.polyline(routeBase(d).map(p => [p.lat, p.lng]), { color: C.amber, weight: sel ? 3 : 2, opacity: sel ? 1 : .75, interactive: false }).addTo(dropLayer);
      chevronsFor(routeBase(d), dropLayer, C.amber);
    }
    if (!(d.kind === "route" && sel)) {
      const icon = L.divIcon({ className: "", iconSize: [28, 28], iconAnchor: [14, 14], html: `<div class="pin ${inR ? "in" : ""} ${sel ? "sel" : ""}">${PIN_SVG[d.kind]}</div>` });
      const m = L.marker([d.lat, d.lng], { icon, draggable: true, autoPan: true, title: d.title, zIndexOffset: sel ? 500 : 0 }).addTo(dropLayer);
      m.on("click", () => select(d.id));
      wireDrag(m, d, ring, line);
    } else {
      d.points.forEach((p, i) => {
        const h = L.marker([p.lat, p.lng], { draggable: true, autoPan: true, zIndexOffset: 600, title: "Stop " + (i + 1),
          icon: L.divIcon({ className: "", iconSize: [22, 22], iconAnchor: [11, 11], html: `<div class="wp">${i + 1}</div>` }) }).addTo(dropLayer);
        wireWaypointDrag(h, d, i, ring, line);
      });
    }
  }
}
/* drag a whole drop. Routes move as a unit. */
function wireDrag(m, d, ring, line) {
  let from = null;
  m.on("dragstart", () => { S.dragging = true; from = snapshot(d); });
  m.on("drag", () => {
    const ll = m.getLatLng(); ring.setLatLng(ll);
    if (line) { const dLat = ll.lat - from.lat, dLng = ll.lng - from.lng; line.setLatLngs((from.path || from.points).map(p => [p.lat + dLat, p.lng + dLng])); }
  });

  const cam = new THREE.PerspectiveCamera(), camPos = new THREE.Vector3();
  let hitSource = null; try { const v = await session.requestReferenceSpace("viewer"); hitSource = await session.requestHitTestSource({ space: v }); } catch (e) {}
  let origin = await routeOrigin(d), aligned = false, t0 = null, floorY = null, wantAlign = true;
  AGL.cb = v => rig.setHover(v); AGL.set(AGL.v);
  $("#arRealign").onclick = () => { routeOrigin(d).then(o2 => { origin = o2; wantAlign = true; aligned = false; t0 = null; }); };
  const correct = courseCorrector(rig);
  renderer.setAnimationLoop((time, frame) => {
    const t = time / 1000, xrCam = renderer.xr.getCamera(cam); camPos.setFromMatrixPosition(xrCam.matrixWorld); if (t0 == null) t0 = t;
    if (frame && hitSource) {
      const hits = frame.getHitTestResults(hitSource);
      if (hits.length) { const p = hits[0].getPose(renderer.xr.getReferenceSpace())?.transform.position; if (p && camPos.y - p.y > .6 && camPos.y - p.y < 2.4) { floorY = floorY == null ? p.y : floorY * .92 + p.y * .08; if (aligned) rig.setFloor(floorY); scanner?.setFloor(floorY); } }
    }
    if (frame && scanner) scanner.sample(frame, renderer.xr.getReferenceSpace(), t);
    if (wantAlign && t - t0 > 1 && (Compass.heading != null || t - t0 > 3.5)) {
      const f = flatForward(xrCam.matrixWorld), hd = headingOrFallback(d, origin.geo);
      rig.setAlign({ geo: origin.geo, h: hd.h, f: { x: f.x, z: f.z }, r: { x: -f.z, z: f.x }, ox: camPos.x, oz: camPos.z, floorY: floorY ?? camPos.y - 1.45, e0: origin.e, userE: origin.e, s: 1, vex: 1, hover: AGL.v, pole: 1.3 });
      rig.startAt({ x: camPos.x, z: camPos.z }); aligned = true; wantAlign = false;
      Heading.bind(rig, hd.compass ? "Compass" : "No compass");
      if (scan) hint((scanner ? "Depth scan on. " : "No depth scan on this phone. ") + (rig.status || "Loading outlines…") + " Use ⟲ ⟳ to line them up with real walls.");
      else hint((origin.snapped != null ? `Starting from stop ${origin.snapped + 1}. ` : "") + (hd.compass ? "The blue line leads to the next stop. If it looks off, face where the stop really is and tap Aim, or walk a few steps and it corrects itself." : "No compass reading. Face where the next stop really is and tap Aim, or drag sideways."));
    }
    Heading.cam = xrCam; Heading.user = { x: camPos.x, z: camPos.z };
    if (aligned) {
      const fix = correct(t, { x: camPos.x, z: camPos.z });
      if (fix) { Heading.src = "Corrected by walking"; Heading.show(); hint(`Direction corrected by ${fix > 0 ? "+" : ""}${fix.toFixed(0)}° from your walking.`); }
      rig.update(t, { x: camPos.x, z: camPos.z }); if (rig.complete()) hint("Route complete");
    }
    renderer.render(rig.scene, cam);
  });
  const cleanup = () => { if (ended) return; ended = true; renderer.setAnimationLoop(null); hitSource?.cancel?.(); scanner?.dispose(); rig.dispose(); renderer.dispose(); AGL.cb = null; AR.setXray = null; };
  session.addEventListener("end", () => { cleanup(); if (AR.stop) { AR.stop = null; closeAR(); } });
  AR.stop = () => { cleanup(); session.end().catch(() => {}); };
}

async function startRouteCamera(d, permP) {
  const scan = d.id === "__scan"; let ended = false;
  showAR(d, "camera"); hint("Starting camera"); Compass.start();
  let stream; try { stream = await openCameraFeed(); } catch (e) { return startRouteViewer(d, "Camera blocked. Showing 3D preview."); }
  const perm = await permP;
  const obs = { polys: [] };
  const cr = cameraRig(), rig = routeRig(d, { tube: .02, dia: .1, label: .9, reach: 8, stemEvery: 2, noPath: scan, planner: makePlanner(obs) });
  AR.setXray = v => rig.setXray(v);
  loadSurroundings(rig, obs, scan, () => ended, false);
  const origin = await routeOrigin(d); let aligned = false, raf = 0, t0 = performance.now();
  AGL.cb = v => rig.setHover(v); AGL.set(AGL.v);
  const align = () => {
    const f = flatForward(cr.cam.matrixWorld), hd = headingOrFallback(d, origin.geo);
    cr.cam.position.x = 0; cr.cam.position.z = 0;
    rig.setAlign({ geo: origin.geo, h: hd.h, f: { x: f.x, z: f.z }, r: { x: -f.z, z: f.x }, ox: 0, oz: 0, floorY: 0, e0: origin.e, userE: origin.e, s: 1, vex: 1, hover: AGL.v, pole: 1.3 });
    rig.startAt({ x: 0, z: 0 }); aligned = true; Heading.bind(rig, hd.compass ? "Compass" : "No compass");
    hint(scan ? (rig.status || "Loading building outlines and paths…") + " Use ⟲ ⟳ to line them up with real walls." : hd.compass ? "Turned by compass, which can be 15° off. If a stop looks off, face where it really is and tap Aim, or drag sideways." : "No compass reading. Face where the next stop really is and tap Aim, or drag sideways to turn the route.");
  };
  $("#arRealign").onclick = () => { aligned = false; t0 = performance.now(); };
  const loop = () => {
    raf = requestAnimationFrame(loop); const t = performance.now() / 1000; cr.step();
    if (!aligned && ((cr.hasOri() && (Compass.heading != null || performance.now() - t0 > 3000)) || performance.now() - t0 > 4000)) {
      align();
      if (!cr.hasOri()) hint(perm === "granted" ? "No motion data from this phone, so the view can't turn with you." : "Motion & Orientation access was declined, so the view can't turn with you. Close Safari's tab, reopen the page and tap Allow.");
    }
    if (aligned) {
      // no WebXR translation here, so walking comes from GPS, smoothed
      const q = rig.xz(S.me); cr.cam.position.x += (q.x - cr.cam.position.x) * .04; cr.cam.position.z += (q.z - cr.cam.position.z) * .04;
      rig.update(t, { x: cr.cam.position.x, z: cr.cam.position.z });
      Heading.cam = cr.cam; Heading.user = { x: cr.cam.position.x, z: cr.cam.position.z };
      if (rig.complete()) hint("Route complete");
    }
    cr.renderer.render(rig.scene, cr.cam);
  };
  loop();
  AR.stop = () => { ended = true; cancelAnimationFrame(raf); cr.stop(); rig.dispose(); stream.getTracks().forEach(x => x.stop()); $("#arVideo").srcObject = null; AGL.cb = null; AR.setXray = null; };
}

function startRouteViewer(d, note) {
  if (AR.stop) { const s = AR.stop; AR.stop = null; s(); }
  const scan = d.id === "__scan"; let ended = false;
  $("#arStage").innerHTML = ""; $("#arVideo").hidden = true; showAR(d, "viewer");
  const prof = d.profile?.pts?.length > 1 ? d.profile.pts : densify(routeBase(d), 6).map(p => ({ ...p, e: null }));
  const c = { lat: prof.reduce((a, p) => a + p.lat, 0) / prof.length, lng: prof.reduce((a, p) => a + p.lng, 0) / prof.length };
  const ext = scan ? 140 : Math.max(20, ...prof.map(p => dist(c, p))), es = prof.map(p => p.e).filter(e => e != null), emin = es.length ? Math.min(...es) : 0;
  const rig = routeRig(d, { tube: .012, dia: .045, label: .55, reach: 6, stemEvery: 1, preview: true, noPath: scan });
  if (scan) rig.setExtras(xrayLayer({}, { radius: ext * 1.6, preview: true, beacons: true, rings: true }));
  Surround.get(c, Math.round(Math.min(320, ext * 1.6))).then(dt => {
    if (ended) return;
    if (dt.buildings.length || dt.ways.length || scan) rig.setExtras(xrayLayer(dt, { radius: ext * 1.6, preview: true, beacons: scan, rings: scan }));
    if (scan) hint(surroundMsg(dt) + " Drag to orbit.");
  });
  rig.setAlign({ geo: c, h: 0, f: { x: 0, z: -1 }, r: { x: 1, z: 0 }, ox: 0, oz: 0, floorY: 0, e0: emin, userE: prof[0].e ?? emin, s: 2.2 / ext, vex: 1.5, hover: AGL.v * .12, pole: .32 });
  rig.scene.background = lc(cssVar("--scene-bg")); rig.scene.add(gridFloor(5, 20));
  const me = new THREE.Group(); me.add(circle(.05, 0x4CC9F0, 1, 24), seg(V(0, 0, 0), V(0, .25, 0), 0x4CC9F0, .8)); me.visible = false; rig.scene.add(me);
  const orbit = orbitRig(V(0, .15, 0), 4.2);
  const near = () => S.me && dist(S.me, c) < ext * 3;
  if (near()) rig.startAt(rig.xz(S.me));
  AGL.cb = v => rig.setHover(v * .12); AGL.set(AGL.v);
  $("#arRealign").onclick = () => near() && rig.startAt(rig.xz(S.me));
  hint(note || (scan ? "Buildings around you from map data, with nearby drops. Drag to orbit." : `Height exaggerated 1.5×. ${d.profile?.ok ? "" : "Terrain not loaded, so it's flat. "}${near() ? "The blue line runs from you to the next stop." : "Drag to orbit."}`));
  let raf = 0;
  const loop = () => {
    raf = requestAnimationFrame(loop); orbit.step(); const t = performance.now() / 1000;
    let user = null;
    if (near()) { user = rig.xz(S.me); me.visible = true; me.position.set(user.x, 0, user.z); } else me.visible = false;
    rig.update(t, user); orbit.renderer.render(rig.scene, orbit.cam);
  };
  loop();
  AR.setXray = v => rig.setXray(v);
  AR.stop = () => { ended = true; cancelAnimationFrame(raf); orbit.stop(); rig.dispose(); AGL.cb = null; AR.setXray = null; };
}
function openScan() {
  if (!S.me) return toast("Waiting for your location.");
  const d = { id: "__scan", kind: "route", title: "Surroundings", radius: 0, points: [{ lat: S.me.lat, lng: S.me.lng }] };
  const touch = matchMedia("(pointer: coarse)").matches;
  const needPerm = typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function";
  const perm = needPerm ? DeviceOrientationEvent.requestPermission().catch(() => "denied") : Promise.resolve("granted");
  if (S.xr) return startRouteXR(d);
  if (touch && navigator.mediaDevices?.getUserMedia) return startRouteCamera(d, perm);
  startRouteViewer(d);
}
$("#btnScan").addEventListener("click", openScan);

/* ================= boot ================= */
importFromHash();
setPanel(wide());
renderList();
startGeo();
S.drops.filter(d => d.kind === "route" && !d.profile).forEach(computeProfile);
S.drops.filter(d => d.kind === "route" && !d.drawn && d.walk !== false && !d.path).forEach(fetchWalk);
</script>
