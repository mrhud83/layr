name: WaterBalloonAR
options:
  bundleIdPrefix: com.layr
  deploymentTarget:
    iOS: "16.0"
targets:
  WaterBalloonAR:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.layr.waterballoonar
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera shows real-world surfaces so you can throw AR water balloons."
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: "arkit"
        INFOPLIST_KEY_UIInterfaceOrientationPortrait: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SUPPORTS_MACCATALYST: "NO"
