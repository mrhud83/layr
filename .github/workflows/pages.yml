name: Deploy prototype to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["prototype/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: prototype
      # GitHub sometimes can't find the artifact it just uploaded; wait and try again
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 20
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deployment
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.second.outputs.page_url }}" >> "$GITHUB_OUTPUT"
